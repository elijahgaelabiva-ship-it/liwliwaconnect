<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — Liwliwa Connect</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F5F7FA;
    color: #141C24;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
  }
  .icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: rgba(22, 104, 227, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 8px;
    color: #0B2A4A;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #141C24;
    opacity: 0.65;
    margin: 0 0 24px;
  }
  button {
    background: linear-gradient(135deg, #1668E3, #17B8A6);
    color: #FFFFFF;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 10px 24px -8px rgba(22, 104, 227, 0.5);
    cursor: pointer;
  }
  button:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">
      <!-- inline SVG (wifi-off), not an emoji, and doesn't need the Lucide CDN this page can't reach offline -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1668E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Reconnect and try again — pages you've already visited will still work without internet.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
