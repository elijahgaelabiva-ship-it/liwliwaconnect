<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Events — Liwliwa Connect">
<meta property="og:description" content="Live music, surf competitions, markets, and things happening around Liwliwa, Zambales.">
<meta property="og:image" content="https://liwliwaconnect.netlify.app/icons/icon-512.png">
<meta property="og:url" content="https://liwliwaconnect.netlify.app/events.html">
<meta property="og:site_name" content="Liwliwa Connect">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Events — Liwliwa Connect">
<meta name="twitter:description" content="Live music, surf competitions, markets, and things happening around Liwliwa, Zambales.">
<meta name="twitter:image" content="https://liwliwaconnect.netlify.app/icons/icon-512.png">
<title>Events — Liwliwa Connect</title>
<meta name="description" content="What's happening in Liwliwa, San Felipe, Zambales — live music, surf competitions, markets, and more." />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://wsrv.nl"> <!-- image optimization proxy, see js/main.js AppImage -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />

<!-- Makes the site installable to the home screen, opening full-view with no
     browser address bar or nav bar, like a native app. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1668E3">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liwliwa">
<meta name="mobile-web-app-capable" content="yes">

<script>
  // "Mobile App V2" palette — see css/style.css "MOBILE APP V2" section.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ocean: '#1668E3',
          oceanDeep: '#0B2A4A',
          turquoise: '#17B8A6',
          sunset: '#FF7A45',
          mist: '#F5F7FA',
          ink: '#141C24',
          success: '#2FB380',
          danger: '#F0605F',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
</head>
<body class="bg-mist text-ink font-sans antialiased">

  <section class="relative overflow-hidden px-6 pt-[max(1.5rem,env(safe-area-inset-top))] pb-6 text-white" style="background-image:url('images/hero-beach.webp'); background-size:cover; background-position:center;">
    <div class="absolute inset-0 bg-gradient-to-b from-oceanDeep/55 via-oceanDeep/45 to-oceanDeep/90"></div>
    <div class="relative z-10">
    <a href="guest-home.html" class="animate-in inline-flex items-center gap-1.5 text-white/70 text-sm font-medium mb-3">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Back
    </a>
    <p class="animate-in uppercase tracking-[0.2em] text-xs font-semibold text-sunset mb-1">What's on</p>
    <h1 class="animate-in animate-in-delay-1 font-extrabold text-3xl sm:text-4xl mb-5">Events</h1>

    <div id="filterBar" class="animate-in animate-in-delay-2 hscroll gap-2">
      <button data-cat="all" class="chip chip-active">All</button>
      <!-- category chips injected by JS from EventsApp.CATEGORIES, so this
           list can never drift out of sync with events.js -->
    </div>
    </div>
  </section>

  <section class="px-6 py-6">

    <!-- Loading state -->
    <div id="loadingState" class="flex flex-col gap-4">
      <div class="skel h-64 rounded-[1.5rem]"></div>
      <div class="skel h-64 rounded-[1.5rem]"></div>
      <div class="skel h-64 rounded-[1.5rem]"></div>
    </div>

    <!-- Empty state (no events at all, or none in the selected category) -->
    <div id="emptyState" class="hidden text-center py-14">
      <div class="mx-auto mb-4 w-14 h-14 flex items-center justify-center rounded-full bg-ocean/10">
        <i data-lucide="calendar-x" class="w-7 h-7 text-ocean/50"></i>
      </div>
      <p class="font-bold text-lg mb-1">No events found</p>
      <p class="text-sm text-ink/60">Try a different category, or check back soon.</p>
    </div>

    <!-- Cards render here -->
    <div id="eventsList" class="hidden flex flex-col gap-4"></div>

  </section>

  <div class="app-bottom-spacer-v2"></div>

  <script src="js/main.js"></script>
  <script src="js/events.js"></script>
  <script>
    let currentCat = 'all';

    function buildFilterBar() {
      const bar = document.getElementById('filterBar');
      const chips = Object.entries(window.EventsApp.CATEGORIES).map(([key, meta]) => `
        <button data-cat="${key}" class="chip">
          <i data-lucide="${meta.icon}" class="w-3.5 h-3.5"></i>${meta.label}
        </button>
      `).join('');
      bar.insertAdjacentHTML('beforeend', chips);

      bar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-cat]');
        if (!btn) return;
        currentCat = btn.dataset.cat;
        bar.querySelectorAll('button[data-cat]').forEach((b) => b.classList.toggle('chip-active', b === btn));
        renderList();
      });
    }

    function renderList() {
      const listEl = document.getElementById('eventsList');
      const emptyEl = document.getElementById('emptyState');
      const loadingEl = document.getElementById('loadingState');
      loadingEl.classList.add('hidden');

      const events = window.EventsApp.upcoming().filter((ev) => currentCat === 'all' || ev.category === currentCat);

      if (events.length === 0) {
        listEl.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.classList.remove('hidden');
      listEl.innerHTML = events.map((ev) => window.EventsApp.renderCard(ev, { compact: false })).join('');
      window.EventsApp.wireCardActions(listEl);
      if (window.lucide) lucide.createIcons();
    }

    buildFilterBar();
    window.EventsApp.ready.then(() => {
      renderList();
      if (window.lucide) lucide.createIcons();
    });
    if (window.lucide) lucide.createIcons();
  </script>

  <div class="floating-nav-wrap">
    <nav class="floating-nav">
      <a href="guest-home.html" class="floating-nav-item">
        <i data-lucide="home"></i>
        <span>Home</span>
      </a>
      <a href="map.html" class="floating-nav-item">
        <i data-lucide="compass"></i>
        <span>Explore</span>
      </a>
      <a href="events.html" class="floating-nav-item active">
        <i data-lucide="calendar"></i>
        <span>Events</span>
      </a>
      <a href="favorites.html" class="floating-nav-item">
        <i data-lucide="heart"></i>
        <span>Saved</span>
      </a>
      <a href="more.html" class="floating-nav-item">
        <i data-lucide="menu"></i>
        <span>More</span>
      </a>
    </nav>
  </div>
</body>
</html>
