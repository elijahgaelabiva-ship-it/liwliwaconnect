<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="robots" content="noindex">
<title>Update My Stall — Liwliwa Connect</title>
<meta name="description" content="Local vendors update their own Liwliwa Connect listing here." />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1668E3">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ocean: '#1668E3',
          oceanDeep: '#0B2A4A',
          turquoise: '#17B8A6',
          sunset: '#FF7A45',
          mist: '#F5F7FA',
          ink: '#141C24',
          success: '#2FB380',
          danger: '#F0605F',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
</head>
<body class="bg-mist text-ink font-sans antialiased">

  <section class="px-6 pt-[max(1.5rem,env(safe-area-inset-top))] pb-6 text-white" style="background: linear-gradient(135deg, #1668E3, #0B2A4A);">
    <a href="local.html" class="inline-flex items-center gap-1.5 text-white/70 text-sm font-medium mb-3">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Back to Local Vendors
    </a>
    <p class="uppercase tracking-[0.2em] text-xs font-semibold text-sunset mb-1">For Vendors</p>
    <h1 class="font-extrabold text-2xl sm:text-3xl mb-1">Update My Stall</h1>
    <p class="text-white/70 text-sm">Change your open status, hours, or notes — updates go live right away, no waiting for approval.</p>
  </section>

  <section class="px-6 py-6 max-w-md mx-auto">

    <!-- STEP 1: unlock -->
    <div id="unlockCard" class="bg-white rounded-2xl p-5 shadow-sm">
      <label class="block text-sm font-semibold text-ink/70 mb-1.5">Your stall</label>
      <select id="vendorSelect" class="w-full bg-mist rounded-xl px-4 py-3 mb-4 outline-none focus-visible:ring-2 focus-visible:ring-ocean">
        <option value="">Loading stalls…</option>
      </select>

      <label class="block text-sm font-semibold text-ink/70 mb-1.5">Your PIN</label>
      <input id="pinInput" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"
        class="w-full bg-mist rounded-xl px-4 py-3 mb-1 outline-none focus-visible:ring-2 focus-visible:ring-ocean" />
      <p class="text-xs text-ink/50 mb-4">Don't have a PIN yet? Ask whoever set up Liwliwa Connect for your area.</p>

      <button id="unlockBtn" class="btn-gradient w-full">
        <i data-lucide="unlock" class="w-4 h-4"></i>
        Unlock my stall
      </button>

      <p id="unlockError" class="hidden text-sm text-danger font-medium mt-3 text-center"></p>
    </div>

    <!-- STEP 2: edit form (hidden until unlocked) -->
    <div id="editCard" class="hidden bg-white rounded-2xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 id="editVendorName" class="font-bold text-lg"></h2>
        <button id="switchStallBtn" class="text-xs font-semibold text-ocean">Switch stall</button>
      </div>

      <label class="block text-sm font-semibold text-ink/70 mb-2">Status</label>
      <div class="flex gap-2 mb-4">
        <button type="button" data-status="open" class="status-btn flex-1 rounded-xl py-3 font-semibold text-sm border-2">🟢 Open</button>
        <button type="button" data-status="closed" class="status-btn flex-1 rounded-xl py-3 font-semibold text-sm border-2">⚪ Closed</button>
      </div>

      <label class="block text-sm font-semibold text-ink/70 mb-1.5">Hours (shown to guests)</label>
      <input id="hoursInput" type="text" placeholder="e.g. Open until 6 PM"
        class="w-full bg-mist rounded-xl px-4 py-3 mb-4 outline-none focus-visible:ring-2 focus-visible:ring-ocean" />

      <label class="block text-sm font-semibold text-ink/70 mb-1.5">Contact number (shown to guests)</label>
      <input id="contactInput" type="tel" placeholder="e.g. 09xxxxxxxxx"
        class="w-full bg-mist rounded-xl px-4 py-3 mb-4 outline-none focus-visible:ring-2 focus-visible:ring-ocean" />

      <label class="block text-sm font-semibold text-ink/70 mb-1.5">Today's note (optional)</label>
      <textarea id="descInput" rows="2" placeholder="e.g. Fresh mangoes today!"
        class="w-full bg-mist rounded-xl px-4 py-3 mb-4 outline-none focus-visible:ring-2 focus-visible:ring-ocean resize-none"></textarea>

      <label class="block text-sm font-semibold text-ink/70 mb-2">We accept</label>
      <div class="flex gap-2 mb-4">
        <button type="button" data-toggle="accepts_cash" class="toggle-chip flex-1 rounded-xl py-2.5 font-semibold text-sm border-2">💵 Cash</button>
        <button type="button" data-toggle="accepts_gcash" class="toggle-chip flex-1 rounded-xl py-2.5 font-semibold text-sm border-2">📱 GCash</button>
      </div>

      <button type="button" data-toggle="family_owned" class="toggle-chip w-full rounded-xl py-2.5 font-semibold text-sm border-2 mb-4">👨‍👩‍👧 Family-owned</button>

      <label class="block text-sm font-semibold text-ink/70 mb-2">Your photo</label>
      <div class="flex items-center gap-3 mb-1">
        <div id="photoPreviewWrap" class="w-20 h-20 rounded-xl bg-mist overflow-hidden flex items-center justify-center shrink-0 border-2 border-ink/10">
          <img id="photoPreviewImg" class="hidden w-full h-full object-cover" alt="" />
          <i data-lucide="image-off" id="photoPreviewIcon" class="w-6 h-6 text-ink/30"></i>
        </div>
        <div class="flex flex-col gap-2 flex-1">
          <label for="photoFileInput" class="inline-flex items-center justify-center gap-1.5 text-sm font-semibold text-ocean bg-ocean/10 rounded-xl py-2.5 px-4 cursor-pointer w-fit">
            <i data-lucide="camera" class="w-4 h-4"></i>
            <span id="photoBtnLabel">Add photo</span>
          </label>
          <input id="photoFileInput" type="file" accept="image/*" class="hidden" />
          <button type="button" id="removePhotoBtn" class="hidden text-xs font-semibold text-danger text-left">Remove photo</button>
        </div>
      </div>
      <p id="photoStatus" class="hidden text-xs text-ink/50 mb-4"></p>

      <label class="block text-sm font-semibold text-ink/70 mb-2">More photos (optional, up to 4)</label>
      <label for="galleryFileInput" class="inline-flex items-center justify-center gap-1.5 text-sm font-semibold text-ocean bg-ocean/10 rounded-xl py-2.5 px-4 cursor-pointer w-fit mb-2">
        <i data-lucide="images" class="w-4 h-4"></i>Add more photos
      </label>
      <input id="galleryFileInput" type="file" accept="image/*" multiple class="hidden" />
      <div id="galleryPreviewGrid" class="flex gap-2 flex-wrap mb-1"></div>
      <p id="galleryStatus" class="hidden text-xs text-ink/50 mb-4"></p>

      <button id="saveBtn" class="btn-gradient w-full">
        <i data-lucide="check" class="w-4 h-4"></i>
        Save — updates instantly
      </button>

      <p id="saveMessage" class="hidden text-sm font-semibold mt-3 text-center"></p>
    </div>

  </section>

  <style>
    .status-btn, .toggle-chip {
      border-color: rgba(20,28,36,0.12);
      color: rgba(20,28,36,0.5);
      background: #fff;
      transition: all 0.15s ease;
    }
    .status-btn.is-active, .toggle-chip.is-active {
      border-color: #1668E3;
      background: rgba(22,104,227,0.08);
      color: #1668E3;
    }
  </style>

  <script src="js/main.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1doFh9X93nSzMbxtDFmOUWEDf8MoT7Csb8XiEmKnh7Zw33RDEDjN8N7WlSFTMS5gb/exec';

    let currentRow = null;
    let currentPin = null;
    let currentStatus = 'open';
    const activeToggles = new Set();
    let pendingPhotoBase64 = null; // set when a new photo is picked, cleared after upload
    let pendingRemovePhoto = false;

    async function loadVendorOptions() {
      const select = document.getElementById('vendorSelect');
      try {
        const res = await fetch(`${API_URL}?type=localvendors`);
        const vendors = await res.json();
        if (!Array.isArray(vendors) || vendors.length === 0) {
          select.innerHTML = '<option value="">No stalls set up yet</option>';
          return;
        }
        select.innerHTML = '<option value="">Choose your stall…</option>' +
          vendors.map(v => `<option value="${v.row}">${escapeHtml(v.vendor_name || 'Unnamed stall')}</option>`).join('');
      } catch (err) {
        console.error('Failed to load vendors:', err);
        select.innerHTML = '<option value="">Couldn\'t load stalls — try refreshing</option>';
      }
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    document.getElementById('unlockBtn').addEventListener('click', async () => {
      const row = document.getElementById('vendorSelect').value;
      const pin = document.getElementById('pinInput').value.trim();
      const errorEl = document.getElementById('unlockError');
      errorEl.classList.add('hidden');

      if (!row) { showUnlockError('Please choose your stall first.'); return; }
      if (!pin) { showUnlockError('Please enter your PIN.'); return; }

      const btn = document.getElementById('unlockBtn');
      btn.disabled = true;
      btn.textContent = 'Checking…';

      try {
        const data = await AppBackend.postJSON(API_URL, { action: 'vendor_login', row, pin });

        if (!data.success) {
          showUnlockError(data.error === 'Incorrect PIN' ? 'That PIN is incorrect — check with whoever set up your listing.' : (data.error || 'Something went wrong.'));
          resetUnlockBtn();
          return;
        }

        currentRow = row;
        currentPin = pin;
        populateEditForm(data.vendor);
        document.getElementById('unlockCard').classList.add('hidden');
        document.getElementById('editCard').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        showUnlockError(err.message || 'Could not reach the server — check your internet connection.');
      }
      resetUnlockBtn();
    });

    function resetUnlockBtn() {
      const btn = document.getElementById('unlockBtn');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="unlock" class="w-4 h-4"></i>Unlock my stall';
      lucide.createIcons();
    }

    function showUnlockError(msg) {
      const el = document.getElementById('unlockError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function isTrue(value) {
      return String(value).trim().toLowerCase() === 'true';
    }

    function populateEditForm(vendor) {
      document.getElementById('editVendorName').textContent = `${vendor.emoji || ''} ${vendor.vendor_name || ''}`.trim();
      document.getElementById('hoursInput').value = vendor.hours_text || '';
      document.getElementById('contactInput').value = vendor.contact_number || '';
      document.getElementById('descInput').value = vendor.description || '';

      pendingPhotoBase64 = null;
      pendingRemovePhoto = false;
      showPhotoPreview(vendor.photo_url || '');
      document.getElementById('photoStatus').classList.add('hidden');

      // Existing gallery photos are shown as read-only reference (not
      // loaded into pendingGalleryPhotos) — picking new ones REPLACES the
      // whole gallery on save, so this is just so a vendor can see what's
      // currently live before deciding whether to add to/replace it.
      pendingGalleryPhotos = [];
      document.getElementById('galleryStatus').classList.add('hidden');
      const existingUrls = String(vendor.photo_urls || '').split(',').map((s) => s.trim()).filter(Boolean);
      const grid = document.getElementById('galleryPreviewGrid');
      grid.innerHTML = existingUrls.length
        ? `<p class="text-xs text-ink/40 w-full mb-1">Current gallery (picking new photos replaces these):</p>` +
          existingUrls.map((url) => `<img src="${escapeHtml(url)}" class="w-14 h-14 rounded-lg object-cover bg-mist shrink-0" alt="" />`).join('')
        : '';

      currentStatus = String(vendor.status || 'open').trim().toLowerCase() === 'closed' ? 'closed' : 'open';
      updateStatusButtons();

      activeToggles.clear();
      if (isTrue(vendor.accepts_cash)) activeToggles.add('accepts_cash');
      if (isTrue(vendor.accepts_gcash)) activeToggles.add('accepts_gcash');
      if (isTrue(vendor.family_owned)) activeToggles.add('family_owned');
      updateToggleButtons();
    }

    function updateStatusButtons() {
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.status === currentStatus);
      });
    }

    function updateToggleButtons() {
      document.querySelectorAll('.toggle-chip').forEach(btn => {
        btn.classList.toggle('is-active', activeToggles.has(btn.dataset.toggle));
      });
    }

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentStatus = btn.dataset.status;
        updateStatusButtons();
      });
    });

    document.querySelectorAll('.toggle-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.toggle;
        if (activeToggles.has(key)) activeToggles.delete(key); else activeToggles.add(key);
        updateToggleButtons();
      });
    });

    // --- Photo upload: resize client-side, then send as base64 to the
    // upload_vendor_photo action, which saves it to Google Drive and
    // writes the resulting link into photo_url. No pasted URLs involved. ---

    function showPhotoPreview(url) {
      const img = document.getElementById('photoPreviewImg');
      const icon = document.getElementById('photoPreviewIcon');
      const removeBtn = document.getElementById('removePhotoBtn');
      const label = document.getElementById('photoBtnLabel');
      if (url) {
        img.src = url;
        img.classList.remove('hidden');
        icon.classList.add('hidden');
        removeBtn.classList.remove('hidden');
        label.textContent = 'Change photo';
      } else {
        img.classList.add('hidden');
        img.src = '';
        icon.classList.remove('hidden');
        removeBtn.classList.add('hidden');
        label.textContent = 'Add photo';
      }
    }

    // Resizes/compresses the picked photo in the browser before upload —
    // keeps uploads small and fast on limited beach-area mobile data.
    function resizeImageFile(file, maxDimension = 1024, quality = 0.68) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
              else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl); // full data URL — used both as instant preview and upload payload
          };
          img.onerror = () => reject(new Error('Could not read that image'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Could not read that file'));
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('photoFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('photoStatus');
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Preparing photo…';
      try {
        const dataUrl = await resizeImageFile(file);
        pendingPhotoBase64 = dataUrl.split(',')[1];
        pendingRemovePhoto = false;
        showPhotoPreview(dataUrl);
        statusEl.textContent = 'New photo selected — tap Save to upload it.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Couldn't read that photo — try a different one.";
      }
      e.target.value = ''; // allow picking the same file again later
    });

    document.getElementById('removePhotoBtn').addEventListener('click', () => {
      pendingPhotoBase64 = null;
      pendingRemovePhoto = true;
      showPhotoPreview('');
      const statusEl = document.getElementById('photoStatus');
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Photo will be removed when you save.';
    });

    // --- Gallery (extra photos beyond the cover) — same resize-then-upload
    // pattern as the cover photo above, but this REPLACES the whole gallery
    // with whatever's picked here rather than adding to what's already
    // saved (same "replace, don't merge" model the business dashboard
    // uses) — simplest thing to reason about for a vendor picking photos
    // on a phone, at the cost of not being able to remove just one photo
    // out of several already saved without re-picking all of them. ---
    let pendingGalleryPhotos = []; // base64 strings, up to 4

    function renderGalleryPreview() {
      const grid = document.getElementById('galleryPreviewGrid');
      grid.innerHTML = pendingGalleryPhotos.map((b64, i) => `
        <div class="relative w-14 h-14 rounded-lg overflow-hidden bg-mist shrink-0">
          <img src="data:image/jpeg;base64,${b64}" class="w-full h-full object-cover" alt="" />
          <button type="button" class="galleryRemoveBtn absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/60 text-white flex items-center justify-center" data-idx="${i}">
            <i data-lucide="x" class="w-2.5 h-2.5"></i>
          </button>
        </div>
      `).join('');
      grid.querySelectorAll('.galleryRemoveBtn').forEach((btn) => {
        btn.addEventListener('click', () => {
          pendingGalleryPhotos.splice(parseInt(btn.dataset.idx, 10), 1);
          renderGalleryPreview();
        });
      });
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('galleryFileInput').addEventListener('change', async (e) => {
      const statusEl = document.getElementById('galleryStatus');
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Preparing photos…';
      const files = Array.from(e.target.files).slice(0, 4 - pendingGalleryPhotos.length);
      try {
        for (const file of files) {
          const dataUrl = await resizeImageFile(file);
          pendingGalleryPhotos.push(dataUrl.split(',')[1]);
        }
        renderGalleryPreview();
        statusEl.textContent = pendingGalleryPhotos.length
          ? `${pendingGalleryPhotos.length} photo(s) ready — tap Save to upload.`
          : '';
        if (!pendingGalleryPhotos.length) statusEl.classList.add('hidden');
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Couldn't read one of those photos — try again.";
      }
      e.target.value = ''; // allow picking the same file again later
    });

    document.getElementById('switchStallBtn').addEventListener('click', () => {
      currentRow = null;
      currentPin = null;
      document.getElementById('editCard').classList.add('hidden');
      document.getElementById('unlockCard').classList.remove('hidden');
      document.getElementById('pinInput').value = '';
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('saveMessage');
      btn.disabled = true;
      msg.classList.add('hidden');

      try {
        // Photo goes up first (its own action, since it writes to Drive),
        // then the rest of the fields save normally.
        //
        // Photo uploads are the heaviest request this page makes, so on a
        // weak beach-area signal the upload can finish successfully on
        // Google's side while the *response* never makes it back to the
        // phone. AppBackend.postJSON already retries once and turns a bad/
        // missing response into one clean error — on top of that, if it
        // still fails here, we double-check the server's own records
        // before telling the vendor it failed, since the photo may well
        // have saved even though the reply got lost.
        if (pendingPhotoBase64 || pendingGalleryPhotos.length) {
          btn.textContent = 'Uploading photo…';
          const photoPayload = {
            action: 'upload_vendor_photo',
            row: currentRow,
            pin: currentPin,
            mime_type: 'image/jpeg'
          };
          if (pendingPhotoBase64) photoPayload.photo_base64 = pendingPhotoBase64;
          if (pendingGalleryPhotos.length) photoPayload.photo_base64_list = pendingGalleryPhotos;

          let photoData = null;
          try {
            photoData = await AppBackend.postJSON(API_URL, photoPayload);
          } catch (uploadErr) {
            // Ask the server directly whether the photo already landed.
            btn.textContent = 'Checking upload status…';
            try {
              const allVendors = await (await fetch(`${API_URL}?type=localvendors`)).json();
              const thisVendor = Array.isArray(allVendors)
                ? allVendors.find((v) => String(v.row) === String(currentRow))
                : null;
              if (thisVendor && thisVendor.photo_url) {
                photoData = { success: true, photo_url: thisVendor.photo_url };
              } else {
                throw uploadErr;
              }
            } catch (verifyErr) {
              throw uploadErr;
            }
          }

          if (!photoData.success) {
            throw new Error(photoData.error || "Couldn't upload the photo.");
          }
          pendingPhotoBase64 = null;
          pendingGalleryPhotos = [];
        }

        btn.textContent = 'Saving…';
        const fields = {
          status: currentStatus,
          hours_text: document.getElementById('hoursInput').value.trim(),
          contact_number: document.getElementById('contactInput').value.trim(),
          description: document.getElementById('descInput').value.trim(),
          accepts_cash: activeToggles.has('accepts_cash') ? 'TRUE' : 'FALSE',
          accepts_gcash: activeToggles.has('accepts_gcash') ? 'TRUE' : 'FALSE',
          family_owned: activeToggles.has('family_owned') ? 'TRUE' : 'FALSE'
        };
        if (pendingRemovePhoto) {
          fields.photo_url = '';
          pendingRemovePhoto = false;
        }

        const data = await AppBackend.postJSON(API_URL, { action: 'update_vendor', row: currentRow, pin: currentPin, fields });

        msg.classList.remove('hidden');
        if (data.success) {
          msg.classList.remove('text-danger');
          msg.classList.add('text-success');
          msg.textContent = '✅ Saved! Guests will see this right away.';
          document.getElementById('photoStatus').classList.add('hidden');
          document.getElementById('galleryStatus').classList.add('hidden');
          document.getElementById('galleryPreviewGrid').innerHTML = '';
        } else {
          msg.classList.remove('text-success');
          msg.classList.add('text-danger');
          msg.textContent = data.error || 'Something went wrong — please try again.';
        }
      } catch (err) {
        console.error(err);
        msg.classList.remove('hidden');
        msg.classList.remove('text-success');
        msg.classList.add('text-danger');
        msg.textContent = err.message || 'Could not reach the server — check your internet connection.';
      }

      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>Save — updates instantly';
      lucide.createIcons();
    });

    if (window.lucide) lucide.createIcons();
    loadVendorOptions();
  </script>

</body>
</html>
